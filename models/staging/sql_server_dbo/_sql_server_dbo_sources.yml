version: 2

sources:

  - name: sql_server_dbo # name of the source
    description: >
        Raw data demo from Database
    schema: sql_server_dbo # this is the schema our raw data lives in
    database: ALUMNO21_DEV_BRONZE_DB # this is the name of our database

    quoting:
      database: false
      schema: false
      identifier: false

    freshness:
      warn_after: {count: 365, period: day}
      error_after: {count: 730, period: day}

    tables:

      - name: addresses
        description: >
          Data about the different addresses: states, country...
        loaded_at_field: _fivetran_synced
        columns:
          - name: address_id
            description: >
              UUID for each unique address
            data_tests:
              - unique
              - not_null
          - name: zipcode
            description: >
              Number for the zipcode
            data_tests:
              - not_null
              - positive_values
          - name: country
            description: >
              Name of the address country
            data_tests:
              - not_null
          - name: address
            description: >
              Name of the address
            data_tests:
              - not_null
              - unique
          - name: state
            description: >
              Name of the State
            data_tests:
              - not_null
          - name: _fivetran_deleted
            description: >
              simple check if its deleted
          - name: _fivetran_synced
            description: >
                Date when the data was loaded
            data_tests:
              - not_null
      - name: events
        description: >
          Data about the online shipping actions
        loaded_at_field: _fivetran_synced
        columns:
          - name: event_id
            description: >
              UUID for each unique event
            data_tests:
              - unique
              - not_null  
          - name: page_url
            description: >
              url of shipping event
            data_tests:
              - not_null   
          - name: event_type
            description: >
              event description
            data_tests:
              - not_null  
          - name: user_id
            description: >
              UUID of the user that has generated the event
            data_tests:
              - not_null 
          - name: product_id
            description: >
              UUID of the product related with the event
          - name: session_id
            description: >
              UUID of the user session
            data_tests:
              - not_null 
          - name: created_at
            description: >
              date when the event was created
            data_tests:
              - not_null 
          - name: order_id
            description: >
              UUID of the event order
          - name: _fivetran_deleted
            description: >
              simple check if its deleted
          - name: _fivetran_synced
            description: >
                Date when the data was loaded
            data_tests:
              - not_null
      - name: orders
        description: >
          Data about the different shipping requests
        loaded_at_field: _fivetran_synced
        columns:
          - name: order_id
            description: >
              UUID for each unique order
            data_tests:
              - unique
              - not_null
          - name: shipping_service
            description: >
              Type of shipping service
          - name: shipping_cost
            description: >
              Cost of shipping service
            data_tests:
              - positive_values  
          - name: address_id
            description: >
              UUID of the user address
            data_tests:
              - not_null
          - name: created_at
            description: >
              Date when the order was created
            data_tests:
              - not_null  
          - name: promo_id
            description: >
              UUID of the promo applied to the order
          - name: estimated_delivery_at
            description: >
              Date of estimated delivery
          - name: order_cost
            description: >
              Cost order
            data_tests:
              - positive_values  
          - name: user_id
            description: >
              UUID of the user that has generated the order
            data_tests:
              - not_null
          - name: order_total
            description: >
              Total cost order
            data_tests:
              - positive_values  
          - name: delivered_at
            description: >
              Date of estimated delivery
          - name: tracking_id
            description: >
              UUID of the tracking service
          - name: status
            description: >
              Indicates how its going on the status
            data_tests:
              - not_null  
          - name: _fivetran_deleted
            description: >
              simple check if its deleted
          - name: _fivetran_synced
            description: >
                Date when the data was loaded
            data_tests:
              - not_null
      - name: order_items
        description: >
          Information about the different items that has been ordered
        loaded_at_field: _fivetran_synced
        columns:
          - name: order_id
            description: >
              UUID for each unique order
            data_tests:
              - unique
              - not_null
          - name: product_id
            description: >
              UUID for each unique product
            data_tests:
              - unique
              - not_null
          - name: quantity
            description: >
                Number of units products
            data_tests:
              - positive_values
              - not_null
          - name: _fivetran_deleted
            description: >
              simple check if its deleted
          - name: _fivetran_synced
            description: >
                Date when the data was loaded
            data_tests:
              - not_null
      - name: products
        description: >
              Information about products
        loaded_at_field: _fivetran_synced
        columns:
          - name: product_id
            description: >
              UUID for each unique product
            data_tests:
              - unique
              - not_null
          - name: price
            description: >
              Product price
            data_tests:
              - positive_values
              - not_null
          - name: name
            description: >
              Name of the product
            data_tests:
              - unique
              - not_null
          - name: inventory
            description: >
              Local product stock
            data_tests:
              - positive_values
              - not_null
          - name: _fivetran_deleted
            description: >
              simple check if its deleted
          - name: _fivetran_synced
            description: >
                Date when the data was loaded
            data_tests:
              - not_null
      - name: promos
        loaded_at_field: _fivetran_synced
        columns:
          - name: promo_id
          - name: discount
          - name: status
          - name: _fivetran_deleted
          - name: _fivetran_synced 
      - name: users
        loaded_at_field: _fivetran_synced
        columns:
          - name: user_id
          - name: updated_at
          - name: address_id
          - name: last_name
          - name: created_at
          - name: phone_number
          - name: total_orders
          - name: first_name
          - name: email
          - name: _fivetran_deleted
          - name: _fivetran_synced                   
