version: 2

models:
  - name: budget
    description: >
      Curated (silver) version of the Google Sheets budget data. 
      Includes type casting, standardized field names, and UTC load timestamp.
    columns:
      - name: ordinal_register
        data_type: int
        description: >
          Number of each row from google sheet.
        data_tests:
              - unique
              - not_null  
      - name: product_id
        data_type: varchar
        description: >
          UUID for each unique product inside platform.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sql_server_dbo__products')
                field: product_id
      - name: quantity
        data_tests:
          - not_null
        data_type: int
        description: >
          Number of units for each product and each month for products
      - name: month
        data_type: date
        description: >
          Each month for the budget -> End of the month.
        data_tests:
          - not_null  
      - name: date_load
        data_type: timestamp_ntz
        description: >
          Date when the data was loaded in UTC
        data_tests:
          - not_null